project:
  packs:
    - pack: ARM::CMSIS@^5.9.0
    - pack: TexasInstruments::MSPM0G1X0X_G3X0X_DFP@^1.3.1
    - pack: ARM::CMSIS-NN@^4.0.0
    - pack: ARM::CMSIS-DSP@^1.10.1
  setups:
    - setup: Options for Target_1
      add-path:
        - ../../../source
        - ../../../lib
      debug: "on"
      define:
        - __MSPM0G3507__
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -Wall
            - -Wextra
            - -Wno-packed
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
          CPP:
            - -xc++
            - -std=c++11
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: ../../../source/ti/devices/msp/m0p/linker_files/keil/mspm0g3507.sct
  groups:
    - group: lib
      files:

        - file: ../../../lib/lab6/timers.h
        - file: ../../../lib/sysctl.c
        - file: ../../../lib/sysctl.h
        - file: adc12.c
        - file: camera.c
        - file: led.c
        - file: timers.c
        - file: uart.c
        - file: i2c.c
        - file: switches.c
        - file: ../../../lib/lab5/adc12.h
        - file: ../../../lib/lab5/camera.h
        - file: ../../../lib/lab5/switches.h
        - file: ../../../lib/lab2/uart.h
        - file: ../../../lib/lab4/I2C/i2c.h
        - file: ../../../lib/lab4/I2C/oled.c
        - file: ../../../lib/lab4/I2C/oled.h
        - file: ../../../lib/lab1/leds.h

    - group: Source Group 1
      files:
        - file: ../../../source/ti/devices/msp/m0p/startup_system_files/keil/startup_mspm0g350x_uvision.s
        - file: main.c
  components:
    - component: ARM::CMSIS:CORE
